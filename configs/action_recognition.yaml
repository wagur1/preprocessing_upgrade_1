# Action recognition on Kinetics-400 (paper's primary task).
# Frozen r3d_18 analyzer; only the preprocessor is trained.

device: auto
out_dir: outputs

task:
  name: action_recognition
  backbone: r3d_18        # r3d_18 | mc3_18 | r2plus1d_18 (all Kinetics-400)
  clip_size: 112          # analyzer input size (resized internally)

model:                    # neural preprocessor
  feat_ch: 32
  n_blocks: 3
  res_scale: 1.0
  cond_dim: 1             # rate-condition width (1 = normalised QP; FiLM input)
  qp_ref: [20, 51]        # QP range mapped to the [0,1] condition level

codec:                    # CompressAI proxy (replaces the paper's virtual codec)
  model: bmshj2018-factorized
  qualities: [1, 2, 3, 5, 8] # includes every quality used by qp_to_quality

data:
  index: data/index/kinetics_3gb.json
  num_frames: 16
  frame_size: 128         # compression resolution (multiple of 64)
  temporal_stride: 2

train:
  epochs: 5
  max_steps: null         # set an int to cap steps (quick Kaggle runs)
  batch_size: 4
  num_workers: 2
  lr: 1.0e-4
  alpha: 10.0             # paper: weight on (distortion + lambda*rate)
  lam: 0.001              # paper: lambda (rate weight)
  real_codec: false        # STE deprecated (incoherent proxy-grad vs x265-forward);
                           # replaced by a distilled differentiable x265 emulator (roadmap).
  real_codec_name: h265   # h264 | h265  (only used if real_codec: true)
  real_codec_preset: medium
  qp_list: [22, 27, 32, 37, 42]
  qp_to_quality: {22: 5, 27: 3, 32: 2, 37: 1, 42: 1}   # tuned so proxy bpp ~ x265 bpp
  real_codec_every_n_steps: 1
  calibration: none       # none (Phase 1) | rate (Phase 2, not implemented)
  cosine: true            # cosine LR decay across all training steps
  patience: 5             # early stop after N epochs w/o val-loss improvement (0 = off)
  min_delta: 1.0e-4       # min val-loss drop that counts as an improvement
  val_max_batches: 20     # cap val batches/epoch (bounds the early-stop probe cost)
  resume: false           # continue from outputs/checkpoints/preprocessor_last.pth

eval:
  batch_size: 4
  num_workers: 2
  qp_list: [30, 35, 40, 45, 50]   # H.264/H.265 anchor QPs (paper range)
  preset: medium
